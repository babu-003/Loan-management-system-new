{% extends "base.html" %}
{% block content %}
<h1>Change Password</h1>
<div class="card" style="max-width:420px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group full" style="margin-bottom:10px;">
        <label>{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
      </div>
    {% endfor %}
    <button class="btn" style="margin-top:8px;">Change Password</button>
  </form>
</div>
{% endblock %}
