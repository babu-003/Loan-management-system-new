{% extends "base.html" %}
{% block content %}
<h1>Add Investor</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      {% for field in form.visible_fields %}
        <div class="form-group {% if field.name == 'address' %}full{% endif %}">
          <label>{{ field.label }}{% if field.field.required %} *{% endif %}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
    </div>
    <button class="btn" style="margin-top:14px;">Save Investor</button>
  </form>
</div>
{% endblock %}
