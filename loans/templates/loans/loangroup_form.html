{% extends "base.html" %}
{% block content %}
<h1>New Loan Group</h1>
<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      {% for field in form.visible_fields %}
        <div class="form-group full">
          <label>{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
    </div>
    <button class="btn" style="margin-top:10px;">Create Group</button>
  </form>
</div>
{% endblock %}
